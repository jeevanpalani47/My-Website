// DIVCORE TECH - Java Spring Boot REST Controller & Security
// File: src/main/java/com/divcoretech/controller/CmsController.java
// ========================================================
package com.divcoretech.controller;

import com.divcoretech.model.*;
import com.divcoretech.repository.*;
import org.springframework.beans.factory.annotation.Autowired;
import org.springframework.http.ResponseEntity;
import org.springframework.security.access.prepost.PreAuthorize;
import org.springframework.web.bind.annotation.*;
import java.util.Map;

@RestController
@RequestMapping("/api/v1")
@CrossOrigin(origins = "https://divcoretech.com")
public class CmsController {

    @Autowired private SiteSettingsRepository settingsRepo;
    @Autowired private BannerRepository bannerRepo;
    @Autowired private ServiceRepository serviceRepo;
    @Autowired private PortfolioRepository portfolioRepo;
    @Autowired private InquiryRepository inquiryRepo;

    @GetMapping("/public/site-data")
    public ResponseEntity<?> getPublicSiteContent() {
        return ResponseEntity.ok(Map.of(
            "settings", settingsRepo.findById(1L).orElseThrow(),
            "banners", bannerRepo.findAll(),
            "services", serviceRepo.findAll(),
            "portfolio", portfolioRepo.findAll()
        ));
    }

    @PostMapping("/public/inquiries")
    public ResponseEntity<CustomerInquiry> submitInquiry(@RequestBody CustomerInquiry inquiry) {
        return ResponseEntity.ok(inquiryRepo.save(inquiry));
    }

    @PutMapping("/admin/settings")
    @PreAuthorize("hasRole('ADMIN')")
    public ResponseEntity<SiteSettings> updateSettings(@RequestBody SiteSettings settings) {
        settings.setId(1L);
        return ResponseEntity.ok(settingsRepo.save(settings));
    }

    @PostMapping("/admin/banners")
    @PreAuthorize("hasRole('ADMIN')")
    public ResponseEntity<HeroBanner> addBanner(@RequestBody HeroBanner banner) {
        return ResponseEntity.ok(bannerRepo.save(banner));
    }

    @PostMapping("/admin/portfolio")
    @PreAuthorize("hasRole('ADMIN')")
    public ResponseEntity<PortfolioProject> addPortfolio(@RequestBody PortfolioProject project) {
        return ResponseEntity.ok(portfolioRepo.save(project));
    }

    @DeleteMapping("/admin/portfolio/{id}")
    @PreAuthorize("hasRole('ADMIN')")
    public ResponseEntity<Void> deletePortfolio(@PathVariable Long id) {
        portfolioRepo.deleteById(id);
        return ResponseEntity.noContent().build();
    }
}`,
        architecture: `DIVCORE TECH - Enterprise Full-Stack Production Architecture
====================================================================
1. FRONTEND (React 18 + Tailwind CSS + Vite)
   ├── /                     -> Public Corporate Landing Page & Portfolio
   ├── /#admin (Hidden)      -> Separate Admin Route (Not linked in Public Navbar)
   └── Auth Guard            -> Stores JWT Token in HttpOnly Cookie / Session

2. BACKEND (Java 21 + Spring Boot 3.3 + Spring Security + JWT)
   ├── Public APIs (/api/v1/public/**)
   │    ├── GET  /site-data  -> Fetches Logo, Banners, Services, Portfolio
   │    └── POST /inquiries  -> Saves Customer Contact Form to MySQL
   └── Admin APIs (/api/v1/admin/**) [Protected via JWT Bearer Token]
        ├── PUT  /settings   -> Updates Logo, Hero Title, Banner Images
        ├── CRUD /services   -> Add, Edit, Delete Services & Upcoming Badges
        ├── CRUD /portfolio  -> Add, Edit, Delete Portfolio Items & Images
        └── GET/DEL /inquiries -> View & Manage Customer Leads

3. DATABASE (MySQL 8.0)
   └── Persistent storage for all CMS content, uploaded assets, and inquiries.`

      const banners = siteData.banners || [];

      useEffect(() => {
        if (banners.length <= 1) return;
        const interval = setInterval(() => {
          setActiveSlide((prev) => (prev + 1) % banners.length);
        }, 6500);
        return () => clearInterval(interval);
      }, [banners.length]);

      const currentBanner = banners[activeSlide % Math.max(banners.length, 1)] || banners[0];

      const handleFooterSecretClick = () => {
        footerClickCount.current += 1;
        if (footerClickCount.current >= 3) {
          footerClickCount.current = 0;
          onSecretAdminTrigger();
        }
        setTimeout(() => { footerClickCount.current = 0; }, 1200);
      };

      const filteredPortfolio = portfolioFilter === 'All'
        ? siteData.portfolio
        : siteData.portfolio.filter(p => p.category === portfolioFilter);

      const handleContactSubmit = (e) => {
        e.preventDefault();
        onAddInquiry({
          id: 'inq-' + Date.now(),
          ...contactForm,
          date: new Date().toISOString().split('T')[0]
        });
        setContactForm({ name: '', email: '', service: siteData.services[0]?.title || 'Graphics Design', message: '' });
        setInquirySent(true);
        setTimeout(() => setInquirySent(false), 5000);
      };

      return (

                  <button
                    onClick={() => setSelectedProject(null)}
                    className="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-950/75 text-white flex items-center justify-center hover:bg-slate-900 transition"
                  >
                    ✕
                  </button>
                </div>
                <div className="p-8">
                  <div className="flex items-center gap-3 mb-2">
                    <span className="px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 text-xs font-bold">
                      {selectedProject.category}
                    </span>
                    <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Client: {selectedProject.client}</span>
                  </div>
                  <h3 className="text-2xl font-display font-extrabold text-slate-900 dark:text-white">{selectedProject.title}</h3>
                  <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed mt-3">{selectedProject.description}</p>
                  <div className="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800 flex justify-end">
                    <a
                      href="#contact"
                      onClick={() => setSelectedProject(null)}
                      className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition"
                    >
                      Inquire About Similar Project
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- ROOT APPLICATION CONTROLLER ---
    const App = () => {
      const STORAGE_KEY = 'divcore_tech_cms_unified_v1';

      const [theme, setTheme] = useState(() => {
        return localStorage.getItem('divcore_theme_mode') || 'light';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('divcore_theme_mode', theme);
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const [siteData, setSiteData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : INITIAL_SITE_DATA;
        } catch (err) {
          return INITIAL_SITE_DATA;
        }
      });

      const [currentView, setCurrentView] = useState(() => {
        return window.location.hash === '#admin' ? 'admin' : 'public';
      });

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(siteData));
        } catch (err) {
          console.warn('Local storage quota exceeded for large images.');
        }
      }, [siteData]);

      useEffect(() => {
        const handleHashChange = () => {
          if (window.location.hash === '#admin') {
            setCurrentView('admin');
          } else if (currentView === 'admin' && window.location.hash !== '#admin') {
            setCurrentView('public');
          }
        };

        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
            e.preventDefault();
            window.location.hash = '#admin';
            setCurrentView('admin');
          }
        };

        window.addEventListener('hashchange', handleHashChange);
        window.addEventListener('keydown', handleKeyDown);
        return () => {
          window.removeEventListener('hashchange', handleHashChange);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, [currentView]);

      const enterAdminView = () => {
        window.location.hash = '#admin';
        setCurrentView('admin');
        window.scrollTo(0, 0);
      };

      const exitAdminView = () => {
        history.replaceState(null, '', window.location.pathname + window.location.search);
        setCurrentView('public');
        window.scrollTo(0, 0);
      };

      const handleAddInquiry = (newInquiry) => {
        setSiteData(prev => ({
          ...prev,
          inquiries: [newInquiry, ...prev.inquiries]
        }));
      };

      const handleResetDefaults = () => {
        setSiteData(INITIAL_SITE_DATA);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_SITE_DATA));
      };

      if (currentView === 'admin') {
        return (
          <AdminPanelPage
            siteData={siteData}
            setSiteData={setSiteData}
            onExitAdmin={exitAdminView}
            onResetDefaults={handleResetDefaults}
            theme={theme}
            toggleTheme={toggleTheme}
          />
        );
      }

      return (
        <PublicCorporateSite
          siteData={siteData}
          onAddInquiry={handleAddInquiry}
          onSecretAdminTrigger={enterAdminView}
          theme={theme}
          toggleTheme={toggleTheme}
        />
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
